<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F172A">
<title>BudgetPro — Project Budgets & Estimates</title>
<meta name="description" content="Build itemized project estimates, sign them, and export branded PDFs.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
:root{--bg:#F1F5F9;--card:#fff;--ink:#0F172A;--mut:#64748B;--line:#E2E8F0;--acc:#10B981;--acc2:#059669;--navy:#0F172A;--in:#F8FAFC;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1120;--card:#111A2E;--ink:#E2E8F0;--mut:#94A3B8;--line:#1E2A44;--in:#0B1120}}
:root[data-theme="dark"]{--bg:#0B1120;--card:#111A2E;--ink:#E2E8F0;--mut:#94A3B8;--line:#1E2A44;--in:#0B1120}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,system-ui,sans-serif}
h1,h2,h3,.brand{font-family:Poppins,Inter,sans-serif;margin:0}
#app{display:flex;min-height:100vh}
aside{width:232px;flex:none;background:linear-gradient(170deg,#0F172A,#13284a);color:#CBD5E1;padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px;backdrop-filter:blur(14px)}
.brand{color:#fff;font-size:20px;padding:4px 10px 18px;display:flex;gap:8px;align-items:center}
.brand i{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#10B981,#34D399);display:grid;place-items:center;color:#0F172A;font-style:normal;font-weight:700}
.nav{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;color:inherit;background:none;border:0;font:inherit;cursor:pointer;text-align:left;position:relative;transition:.2s}
.nav:hover{background:rgba(255,255,255,.07);color:#fff}
.nav.on{background:rgba(16,185,129,.16);color:#fff}
.nav.on:before{content:"";position:absolute;left:-14px;top:8px;bottom:8px;width:4px;border-radius:4px;background:var(--acc)}
.nav svg{width:18px;height:18px;transition:transform .25s}.nav:hover svg{transform:scale(1.15) rotate(-6deg)}
.sp{flex:1}
main{flex:1;min-width:0;padding:28px 32px 90px;max-width:1180px;margin:0 auto;animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:22px}
h1{font-size:24px}.mut{color:var(--mut)}
.btn{border:0;border-radius:10px;padding:10px 16px;font:600 13px Inter;cursor:pointer;transition:transform .12s,box-shadow .2s,background .2s;background:var(--in);color:var(--ink);border:1px solid var(--line)}
.btn:active{transform:scale(.96)}
.pri{background:linear-gradient(135deg,#10B981,#059669);color:#fff;border:0;box-shadow:0 6px 16px -6px rgba(16,185,129,.7)}
.pri:hover{box-shadow:0 10px 22px -6px rgba(16,185,129,.8)}
.dng{color:#DC2626}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 1px 2px rgba(15,23,42,.04),0 8px 24px -16px rgba(15,23,42,.18);transition:transform .2s,box-shadow .2s}
.lift:hover{transform:translateY(-3px)}
.grid{display:grid;gap:16px}.g4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:2fr 1fr}.f2{grid-template-columns:1fr 1fr}.f3{grid-template-columns:1fr 1fr 1fr}
.stat b{display:block;font:700 26px Poppins;margin-top:4px}
label{display:block;font-weight:500;font-size:12px;color:var(--mut);margin-bottom:4px}
input,select,textarea{width:100%;background:var(--in);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:9px 11px;font:inherit;outline:0;transition:.15s}
input:focus,select:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(16,185,129,.18)}
textarea{min-height:90px;resize:vertical}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;color:var(--mut);font-weight:500;padding:8px 6px;border-bottom:1px solid var(--line)}
td{padding:6px;border-bottom:1px solid var(--line);vertical-align:middle}
.scroll{overflow-x:auto}
.items input,.items select{padding:7px 8px}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600}
.Draft{background:#E2E8F0;color:#334155}.Sent{background:#DBEAFE;color:#1D4ED8}.Approved{background:#D1FAE5;color:#047857}.Rejected{background:#FEE2E2;color:#B91C1C}.Completed{background:#EDE9FE;color:#6D28D9}
.steps{display:flex;gap:6px;margin-bottom:18px;overflow-x:auto}
.stp{flex:1;min-width:92px;padding:9px 10px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:12px;color:var(--mut);cursor:pointer}
.stp.on{border-color:var(--acc);color:var(--ink);box-shadow:inset 0 -3px 0 var(--acc)}.stp.done{color:var(--acc2)}
.tot div{display:flex;justify-content:space-between;padding:6px 0}
.tot .gt{border-top:2px solid var(--ink);margin-top:6px;padding-top:12px;font:700 22px Poppins;color:var(--acc2)}
canvas.sig{width:100%;height:190px;background:#fff;border:2px dashed var(--line);border-radius:12px;touch-action:none;cursor:crosshair}
.fab{position:fixed;right:24px;bottom:calc(24px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;font-size:28px;z-index:5}
.paper{background:#fff;color:#0F172A;max-width:760px;margin:auto;padding:36px;border-radius:6px;box-shadow:0 20px 50px -20px rgba(0,0,0,.35);font-size:12.5px}
.paper table th{color:#fff;background:#0F172A;padding:8px}.paper td{border-color:#E2E8F0}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:99px;z-index:20;animation:in .25s;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.empty{text-align:center;padding:40px 10px;color:var(--mut)}
.skel{height:84px;border-radius:16px;background:linear-gradient(90deg,var(--line),var(--card),var(--line));background-size:200% 100%;animation:sk 1s infinite}
@keyframes sk{to{background-position:-200% 0}}
@media(max-width:860px){
 #app{flex-direction:column}
 .mbar{display:flex;position:sticky;top:env(safe-area-inset-top,0px);z-index:9;justify-content:space-between;align-items:center;padding:10px 16px;background:rgba(15,23,42,.94);backdrop-filter:blur(12px);color:#fff}
 .mbar .brand{padding:0;font-size:18px}
 .mbar button{background:rgba(255,255,255,.1);border:0;color:#fff;border-radius:10px;width:38px;height:38px;display:grid;place-items:center;cursor:pointer}
 .mbar svg{width:18px;height:18px}
 aside{position:fixed;bottom:0;left:0;right:0;top:auto;width:auto;height:auto;flex-direction:row;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:10;gap:2px;border-top:1px solid rgba(255,255,255,.08)}
 aside .brand,aside .sp,#out,#theme{display:none}
 .nav{flex:1;flex-direction:column;gap:2px;font-size:11px;padding:6px 2px;justify-content:center;align-items:center;border-radius:12px}
 .nav .lbl{display:block}
 .nav.on:before{left:28%;right:28%;top:0;bottom:auto;width:auto;height:3px;border-radius:0 0 4px 4px}
 .nav[data-v=new] svg{background:var(--acc);color:#0F172A;border-radius:50%;padding:6px;width:30px;height:30px}
 main{padding:16px 14px calc(100px + env(safe-area-inset-bottom,0px))}
 h1{font-size:21px}.top{margin-bottom:14px}
 .g4{grid-template-columns:1fr 1fr}.g2,.f2,.f3{grid-template-columns:1fr}
 .stat b{font-size:19px;word-break:break-word}
 .card{padding:16px;border-radius:14px}
 .fab{display:none!important}
 .btn{min-height:40px}
 input,select{min-height:44px;font-size:16px}textarea{font-size:16px}
 .steps{margin:0 -14px 14px;padding:0 14px;scroll-snap-type:x proximity}.stp{scroll-snap-align:start;white-space:nowrap}
 .wz{position:sticky;bottom:calc(66px + env(safe-area-inset-bottom,0px));background:var(--bg);padding:10px 0;z-index:4;gap:10px}
 .wz .btn{flex:1;min-height:46px}
 .tot .gt{font-size:19px}
 .paper{padding:18px;font-size:12px}
 .toast{bottom:calc(88px + env(safe-area-inset-bottom,0px));max-width:90vw;text-align:center}
 .items table,.items tbody,.rl,.rl tbody{display:block}
 .items tr:first-child,.rl tr:first-child{display:none}
 .items tr{display:grid;grid-template-columns:repeat(6,1fr);gap:10px 8px;padding:14px;border:1px solid var(--line);border-radius:14px;margin-bottom:12px;background:var(--card)}
 .items td{padding:0;border:0}
 .items td:before{display:block;font-size:11px;color:var(--mut);margin-bottom:2px}
 .items td:nth-child(1){display:none}
 .items td:nth-child(2){order:1;grid-column:1/-1}.items td:nth-child(2):before{content:'Item'}
 .items td:nth-child(3){order:2;grid-column:1/-1}.items td:nth-child(3):before{content:'Description'}
 .items td:nth-child(4){order:3;grid-column:span 3}.items td:nth-child(4):before{content:'Category'}
 .items td:nth-child(6){order:4;grid-column:span 3}.items td:nth-child(6):before{content:'Unit'}
 .items td:nth-child(5){order:5;grid-column:span 2}.items td:nth-child(5):before{content:'Qty'}
 .items td:nth-child(7){order:6;grid-column:span 2}.items td:nth-child(7):before{content:'Rate'}
 .items td:nth-child(8){order:7;grid-column:span 2;text-align:left!important;font-weight:600}.items td:nth-child(8):before{content:'Amount'}
 .items td:nth-child(9){order:8;grid-column:1/-1;display:flex;gap:8px;white-space:normal!important}.items td:nth-child(9) .btn{flex:1}
 .rl tr{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:14px;margin-bottom:10px;background:var(--card)}
 .rl td{padding:0;border:0;white-space:normal!important}
 .rl td:nth-child(2){order:1;font-weight:600;font-size:15px}
 .rl td:nth-child(5){order:2}
 .rl td:nth-child(3){order:3;color:var(--mut)}
 .rl td:nth-child(4){order:4;text-align:right;font-weight:700;color:var(--acc2)}
 .rl td:nth-child(1){order:5;grid-column:1/-1;font-size:12px;color:var(--mut)}
 .rl td:nth-child(6){order:6;grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}.rl td:nth-child(6) .btn{flex:1;padding:9px 6px}
}
.mbar{display:none}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#auth{position:fixed;inset:0;z-index:50;display:none;place-items:center;background:linear-gradient(135deg,#0F172A,#13284a);padding:16px}
</style></head>
<body>
<div id="app">
<header class="mbar"><div class="brand"><i>B</i>BudgetPro</div><div style="display:flex;gap:8px"><button id="mtheme" aria-label="Toggle dark mode"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button><button id="mout" aria-label="Sign out"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg></button></div></header>

 <button class="nav" data-v="set"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.5-2-3.4-2.3 1a7 7 0 0 0-2-1.2L14.3 3h-4l-.4 2.7a7 7 0 0 0-2 1.2l-2.3-1-2 3.4 2 1.5a7 7 0 0 0 0 2.4l-2 1.5 2 3.4 2.3-1a7 7 0 0 0 2 1.2l.4 2.7h4l.4-2.7a7 7 0 0 0 2-1.2l2.3 1 2-3.4-2-1.5c.1-.4.1-.8.1-1.2z"/></svg><span class="lbl">Settings</span></button>
 <div class="sp"></div>

 <button class="nav" id="theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><span class="lbl">Dark mode</span></button>
</aside>
<main id="main"></main>
</div>

<script>
const $=s=>document.querySelector(s);
const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
let S=Object.assign({},{name:'',addr:'',gst:'',phone:'',email:'',web:'',logo:'',cur:'USD',tax:0,terms:'50% advance on approval.\nBalance due on completion.\nPrices valid until the date shown.',sig:'',stamp:''});
let E=[],view='dash',cur=null,step=0,page=0,q='',fs='';
let svT;const save=()=>{clearTimeout(svT);svT=setTimeout(()=>api('/data',{method:'PUT',body:{settings:S,estimates:E}}).catch(e=>toast(e.message)),500)};
const CUR=['USD','PKR','INR','AED','EUR','GBP','SAR','CAD','AUD'],UNITS=['pcs','sqft','kg','hrs','day','m','ltr','lot'],CATS=['Material','Labor','Transport','Misc'],TYPES=['House Construction','Office Setup','Renovation','Custom'],STAT=['Draft','Sent','Approved','Rejected','Completed'];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=(v,c)=>c+' '+(+v||0).toLocaleString('en',{minimumFractionDigits:2,maximumFractionDigits:2});
const opts=(a,v)=>a.map(x=>`<option ${x==v?'selected':''}>${x}</option>`).join('');
function calc(e){const sub=e.items.reduce((a,i)=>a+i.q*i.r,0),d=e.dt=='%'?sub*e.disc/100:+e.disc||0,tx=(sub-d)*e.tax/100,total=sub-d+tx;return{sub,d,tx,total,due:total-(+e.adv||0)}}
function words(n){n=Math.round(n);if(!n)return'Zero';const a='One Two Three Four Five Six Seven Eight Nine Ten Eleven Twelve Thirteen Fourteen Fifteen Sixteen Seventeen Eighteen Nineteen'.split(' '),b='_ _ Twenty Thirty Forty Fifty Sixty Seventy Eighty Ninety'.split(' ');
 const t=x=>x<20?a[x-1]||'':b[x/10|0]+(x%10?' '+a[x%10-1]:'');const h=x=>(x>99?a[x/100|0-1+1-1+0]?a[(x/100|0)-1]+' Hundred '+t(x%100):'':t(x));
 const P=[[1e9,'Billion'],[1e6,'Million'],[1e3,'Thousand'],[1,'']];let r='';for(const[v,nm]of P){const x=Math.floor(n/v);n%=v;if(x)r+=(x>99?a[(x/100|0)-1]+' Hundred '+t(x%100):t(x))+' '+nm+' '}return r.trim()}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),2400)}
function confetti(){const c=$('#cf'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const p=Array.from({length:120},()=>({x:innerWidth/2,y:innerHeight*.6,vx:(Math.random()-.5)*16,vy:-Math.random()*16-4,c:['#10B981','#34D399','#0F172A','#FBBF24','#60A5FA'][Math.random()*5|0],s:4+Math.random()*5}));let f=0;(function a(){x.clearRect(0,0,c.width,c.height);p.forEach(o=>{o.x+=o.vx;o.y+=o.vy;o.vy+=.45;x.fillStyle=o.c;x.fillRect(o.x,o.y,o.s,o.s*1.6)});if(++f<110)requestAnimationFrame(a);else x.clearRect(0,0,c.width,c.height)})()}
function count(el,v,c){const t0=performance.now();(function s(t){const k=Math.min(1,(t-t0)/700),e=1-Math.pow(1-k,3);el.textContent=c?fmt(v*e,c):Math.round(v*e);if(k<1)requestAnimationFrame(s)})(t0)}
function newEst(){const y=new Date().getFullYear(),n=E.filter(e=>e.no.includes('-'+y+'-')).length+1;return{id:Date.now()+'',no:`EST-${y}-${String(n).padStart(4,'0')}`,status:'Draft',client:{name:'',phone:'',email:'',addr:''},type:'House Construction',title:'',start:new Date().toISOString().slice(0,10),due:'',cur:S.cur,items:[{n:'',d:'',q:1,u:'pcs',r:0,c:'Material'}],disc:0,dt:'%',tax:+S.tax||0,adv:0,terms:S.terms,mile:'',valid:'',notes:'',sig:S.sig||'',stamp:S.stamp||'',created:Date.now()}}
function go(v,e){view=v;if(v=='new'){cur=e||newEst();step=0}render()}
document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>go(b.dataset.v));
$('#fab').onclick=()=>go('new');
$('#theme').onclick=()=>{const r=document.documentElement,d=getComputedStyle(r).getPropertyValue('--bg').trim()=='#0B1120';r.dataset.theme=d?'light':'dark'};
function render(){document.querySelectorAll('.nav[data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v==view));$('#fab').style.display=view=='new'?'none':'';const m=$('#main');m.style.animation='none';m.offsetHeight;m.style.animation='';({dash,list,new:builder,set:settings})[view]()}
/* ---------- dashboard ---------- */
function dash(){const m=$('#main');m.innerHTML='<div class="grid g4"><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>';
setTimeout(()=>{if(view!='dash')return;const c=S.cur,tot=E.map(e=>calc(e).total),rev=E.filter(e=>['Approved','Completed'].includes(e.status)).reduce((a,e)=>a+calc(e).total,0),all=tot.reduce((a,b)=>a+b,0),ex=E.reduce((a,e)=>a+e.items.reduce((s,i)=>s+i.q*i.r,0),0);
const mo=Array(6).fill(0).map((_,i)=>{const d=new Date();d.setMonth(d.getMonth()-5+i);return{l:d.toLocaleString('en',{month:'short'}),m:d.getMonth(),y:d.getFullYear(),v:0}});E.forEach(e=>{const d=new Date(e.created),s=mo.find(k=>k.m==d.getMonth()&&k.y==d.getFullYear());if(s)s.v+=calc(e).total});const mx=Math.max(1,...mo.map(k=>k.v));
m.innerHTML=`<div class="top"><div><h1>Dashboard</h1><span class="mut">${S.name?'Welcome back, '+esc(S.name):'Add your company in Settings to brand every PDF.'}</span></div><button class="btn pri" onclick="go('new')">New estimate</button></div>
<div class="grid g4">${[['Projects',E.length,0],['Total quoted',all,1],['Approved revenue',rev,1],['Itemized expenses',ex,1]].map(s=>`<div class="card lift stat"><span class="mut">${s[0]}</span><b data-n="${s[1]}" data-c="${s[2]}">0</b></div>`).join('')}</div>
<div class="grid g2" style="margin-top:16px"><div class="card"><h3 style="margin-bottom:14px;font-size:16px">Monthly budgets</h3><svg viewBox="0 0 360 170" width="100%" role="img" aria-label="Monthly budget totals">${mo.map((k,i)=>{const h=k.v/mx*120;return`<rect x="${i*60+14}" y="${140-h}" width="34" height="${h}" rx="6" fill="#10B981" opacity="${k.v?1:.25}"><animate attributeName="height" from="0" to="${h}" dur=".6s"/><animate attributeName="y" from="140" to="${140-h}" dur=".6s"/></rect><text x="${i*60+31}" y="160" text-anchor="middle" font-size="11" fill="var(--mut)">${k.l}</text>`}).join('')}</svg></div>

<div class="card"><h3 style="font-size:16px;margin-bottom:12px">Saved signature</h3><canvas class="sig" id="sg"></canvas><div style="display:flex;gap:8px;margin-top:12px"><button class="btn" id="un">Undo</button><button class="btn" id="cl">Clear</button></div><label style="margin-top:14px">Or upload a signature image (PNG or JPG)</label><input type="file" id="sgf" accept="image/png,image/jpeg,image/webp"><label style="margin-top:14px">Company stamp (PNG or JPG)</label><input type="file" id="stf" accept="image/png,image/jpeg,image/webp">${S.stamp?`<img src="${S.stamp}" alt="Stamp" style="height:80px;display:block;margin-top:10px"><button class="btn dng" id="stx" style="margin-top:8px">Remove stamp</button>`:''}<p class="mut">New estimates start with this signature and stamp.</p></div></div>`;
document.querySelectorAll('[data-s]').forEach(el=>{el.value=S[el.dataset.s];el.oninput=()=>S[el.dataset.s]=el.type=='number'?+el.value:el.value});
$('#lg').onchange=e=>{const f=e.target.files[0];if(!f)return;if(f.size>1.5e6){toast('Logo must be under 1.5 MB');return}const r=new FileReader();r.onload=()=>{S.logo=r.result;settings()};r.readAsDataURL(f)};
pad($('#sg'),S.sig,d=>S.sig=d);$('#sgf').onchange=ev=>imgUp(ev.target.files[0],d=>{S.sig=d;settings()});$('#stf').onchange=ev=>imgUp(ev.target.files[0],d=>{S.stamp=d;settings()},500);const sx=$('#stx');if(sx)sx.onclick=()=>{S.stamp='';settings()};$('#sv').onclick=()=>{save();toast('Settings saved')}}
const tk=()=>localStorage.getItem('bp_t');
async function api(p,o={}){const r=await fetch('/api'+p,{...o,headers:{'Content-Type':'application/json',Authorization:'Bearer '+tk()},body:o.body&&JSON.stringify(o.body)});const d=await r.json().catch(()=>({}));if(r.status==401){localStorage.removeItem('bp_t');showAuth()}if(!r.ok)throw new Error(d.error||'Request failed');return d}
function showAuth(mode='login'){const a=$('#auth'),L=mode=='login';a.style.display='grid';
a.innerHTML=`<form class="card" style="width:100%;max-width:380px;display:grid;gap:12px"><h1 style="font-size:22px">${L?'Sign in to BudgetPro':'Create your account'}</h1><div><label>Email</label><input type="email" id="ae" required autocomplete="email"></div><div><label>Password</label><input type="password" id="ap" required minlength="6" autocomplete="${L?'current-password':'new-password'}"></div><div id="ar" class="dng" role="alert"></div><button class="btn pri">${L?'Sign in':'Sign up'}</button><button type="button" class="btn" id="swm">${L?'Create an account':'I already have an account'}</button></form>`;
$('#swm').onclick=()=>showAuth(L?'signup':'login');
a.querySelector('form').onsubmit=async e=>{e.preventDefault();try{const d=await fetch('/api/auth/'+mode,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('#ae').value,password:$('#ap').value})}),j=await d.json();if(!d.ok)throw new Error(j.error);localStorage.setItem('bp_t',j.token);boot()}catch(x){$('#ar').textContent=x.message}}}
async function boot(){if(!tk())return showAuth();try{const d=await api('/data');Object.assign(S,d.settings||{});E=d.estimates||[];$('#auth').style.display='none';view='dash';render()}catch(e){}}
$('#out').onclick=()=>{localStorage.removeItem('bp_t');location.reload()};
boot();
$('#mtheme').onclick=()=>$('#theme').click();{const mo=$('#mout');if($('#out'))mo.onclick=()=>$('#out').click();else mo.style.display='none'}
</script></body></html>
